name: release

# npm Trusted Publishing — passwordless via GitHub OIDC.
#
# Prerequisites (one-time, on npmjs.com):
#   Package → Settings → Publishing access → Add Trusted Publisher
#   Repository: <org>/<repo>
#   Workflow filename: release.yml
#   Environment: (leave blank unless you set one in the workflow below)
#
# No NPM_TOKEN secret needed. npm CLI 10.9.1+ handles OIDC automatically.

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: "Version to publish (x.y.z, major, minor, patch, skip)"
        required: true
        default: 'skip'
      ruby_ref:
        description: Override the Ruby ref to build from (branch/tag/SHA). Defaults to the pinned lutaml-model tag.
        required: false
  # Stable release: client_payload.ruby_ref names the lutaml-model ref
  # to build (required). No sender yet; releases run via workflow_dispatch.
  # Dev build: fired by lutaml-model on every push to main. Publishes
  # under the npm `next` dist-tag (does NOT touch `latest`).
  repository_dispatch:
    types: [ do-release, js-sync-main ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve build inputs
        id: inputs
        run: |
          # VERSION
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ github.event.inputs.next_version }}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "skip" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi

          # RUBY_REF
          if [ -n "${{ github.event.client_payload.ruby_ref }}" ]; then
            RUBY_REF="${{ github.event.client_payload.ruby_ref }}"
          else
            RUBY_REF="${{ github.event.inputs.ruby_ref }}"
          fi
          if [ "${{ github.event.action }}" = "do-release" ] && [ -z "$RUBY_REF" ]; then
            echo "::error::do-release requires client_payload.ruby_ref (the lutaml-model ref to build)"
            exit 1
          fi

          # Dev builds (js-sync-main) publish under the `next` dist-tag
          # and use a SHA-stamped version so they don't collide with
          # stable releases.
          if [ "${{ github.event.action }}" = "js-sync-main" ]; then
            VERSION="0.0.0-dev.${{ github.event.client_payload.sha }}"
            RUBY_REF="${{ github.event.client_payload.sha }}"
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi

          {
            echo "version=$VERSION"
            echo "ruby_ref=$RUBY_REF"
            echo "dist_tag=$DIST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # NO registry-url — prevents setup-node from writing
          # _authToken to .npmrc, which would shadow OIDC auth.

      - name: Upgrade npm CLI (Trusted Publishers needs 10.9.1+)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Opal
        run: gem install opal --no-document

      - name: Install ragel
        # Required by `rake vendor:prepare` in lutaml-model to regenerate
        # the opal-oga/opal-ruby-ll forks' parser/lexer outputs that
        # bundle install's C-ext compilation step needs.
        run: sudo apt-get update && sudo apt-get install -y ragel

      - name: Install JS deps
        run: npm install

      - name: Build
        run: node scripts/build.js
        env:
          RUBY_REF: ${{ steps.inputs.outputs.ruby_ref }}
          OPAL_PREFORK_DISABLE: "1"

      - name: Smoke test
        run: node scripts/test.js

      - name: Set package version
        run: |
          VERSION="${{ steps.inputs.outputs.version }}"
          if [ "$VERSION" != "$(node -p "require('./package.json').version")" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      - name: Install sigstore (provenance signer)
        # `npm publish --provenance` requires the `sigstore` module.
        # The global npm CLI installed by `npm install -g npm@latest`
        # doesn't include it. Install it globally so npm's libnpmpublish
        # can find it via the global node_modules tree.
        run: npm install -g sigstore

      - name: Publish to npm (Trusted Publisher — passwordless OIDC)
        # Dev builds (js-sync-main) and manual workflow_dispatch both
        # publish. pr-check.yml (js-pr-check event) does NOT publish —
        # it has its own workflow.
        run: |
          if [ "${{ steps.inputs.outputs.dist_tag }}" = "next" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
